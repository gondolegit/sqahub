# Profil khusus untuk test (@SpringBootTest, profil "test"): pakai H2 in-memory,
# supaya context bisa load tanpa perlu MySQL sungguhan berjalan di mesin/CI.
spring.datasource.url=jdbc:h2:mem:sqahub_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
