spring.application.name=SQAHUB Backend

# ==================================
# 1. SERVER CONFIGURATION
# ==================================
server.port=8080

# ==================================
# 2. DATABASE CONFIGURATION (MySQL Example)
# Ganti dengan konfigurasi database Anda
# ==================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sqahub_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA (Hibernate)
# PENTING (Production): set env var JPA_DDL_AUTO=validate (atau 'none' + jalankan migration
# terpisah, mis. Flyway/Liquibase). 'update' hanya aman untuk development.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Jika menggunakan MySQL 8 ke atas, tambahkan ini
spring.jpa.properties.hibernate.format-sql=true

# ==================================
# 3. JWT SECURITY CONFIGURATION
# ==================================
# Kunci rahasia untuk menandatangani JWT. HARUS diganti dengan string yang panjang dan kompleks.
# PENTING (Production): override lewat environment variable JWT_SECRET, JANGAN commit secret asli ke git.
# Nilai default di bawah ini hanya untuk pengembangan lokal dan HARUS dirotasi sebelum deploy,
# karena sudah pernah tercatat di riwayat repository.
application.security.jwt.secret-key=${JWT_SECRET:19f72843e780b552ec244b70d5c6f01628e18120f3d573b298dd8db44cc47bf4e0857491868a319a24d0323589ea280c37bfa4601529622570b3fcf9760ec0c5}
# Masa berlaku token dalam milidetik (Contoh: 24 jam)
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
# Nama header yang digunakan untuk mengirim token
app.security.jwt.header=Authorization
# Prefix token (Contoh: "Bearer ")
app.security.jwt.token-prefix=Bearer

# ==================================
# 4. CORS CONFIGURATION
# ==================================
# Daftar origin frontend yang diizinkan, dipisahkan koma. Override lewat environment
# variable CORS_ALLOWED_ORIGINS saat deploy ke domain production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ==================================
# 5. DEPLOY DECISION CONFIGURATION
# ==================================
# Ambang batas pass rate (%) minimum agar Test Suite dianggap "LAYAK_DEPLOY".
# Override lewat environment variable DEPLOY_PASS_RATE_THRESHOLD sesuai kebijakan tim QA.
app.deploy-decision.pass-rate-threshold=${DEPLOY_PASS_RATE_THRESHOLD:95.0}

# ==================================
# 6. EMAIL (FORGOT PASSWORD) CONFIGURATION - Gmail SMTP
# ==================================
# WAJIB diisi lewat environment variable MAIL_USERNAME & MAIL_APP_PASSWORD agar fitur
# forgot-password berfungsi. MAIL_APP_PASSWORD BUKAN password akun Gmail biasa -
# buat "App Password" di myaccount.google.com/apppasswords (akun harus mengaktifkan 2FA dulu).
# Jika tidak diisi, endpoint /auth/forgot-password akan gagal mengirim email (dicatat di log server),
# tapi TIDAK akan membuat aplikasi gagal start.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# URL halaman reset-password di frontend, token akan ditempel sebagai query param ?token=...
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# ==================================
# 7. GOOGLE OAUTH2 LOGIN CONFIGURATION
# ==================================
# Fitur login Google HANYA aktif jika KEDUA property di bawah diisi (lewat environment
# variable APP_OAUTH2_GOOGLE_CLIENT_ID & APP_OAUTH2_GOOGLE_CLIENT_SECRET). Sengaja TIDAK
# diberi nilai default di sini - kalau tidak di-set, fitur ini otomatis nonaktif tanpa membuat
# aplikasi gagal start (lihat GoogleOAuth2Config).
# app.oauth2.google.client-id=
# app.oauth2.google.client-secret=
# Setelah login Google sukses, browser akan diarahkan ke URL ini dengan ?token=<JWT>
# (atau ?error=... jika gagal).
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# ==================================
# 8. ACTUATOR (HEALTH CHECK / MONITORING)
# ==================================
# /actuator/health dan /actuator/info publik (lihat SecurityConfiguration), endpoint lain butuh role ADMIN.
management.endpoints.web.exposure.include=health,info,metrics
# "when-authorized": anonymous cuma lihat status UP/DOWN, detail (koneksi DB, dsb) hanya untuk yang login.
management.endpoint.health.show-details=when-authorized

# ==================================
# 9. RATE LIMITING (PROTEKSI BRUTE-FORCE LOGIN/REGISTER)
# ==================================
# Maksimum percobaan per IP dalam jendela waktu di bawah, untuk /auth/authenticate dan /auth/register.
app.rate-limit.auth.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
app.rate-limit.auth.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:1}

# ==================================
# 10. FILE UPLOAD (TEST EVIDENCE)
# ==================================
# Direktori lokal penyimpanan file bukti tes yang di-upload. Override lewat env var EVIDENCE_STORAGE_DIR
# saat deploy (idealnya diarahkan ke volume persisten, bukan disk lokal container).
app.evidence.storage-dir=${EVIDENCE_STORAGE_DIR:./evidence-storage}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB