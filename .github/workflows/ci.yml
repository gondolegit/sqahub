name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Test suite runs entirely against the H2 in-memory profile (see application-test.properties),
      # so no MySQL service container is needed here - every test, including the full end-to-end
      # API suite (ApiEndToEndFlowTest), is self-contained.
      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (not pushed - just validates the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sqahub-backend:ci
